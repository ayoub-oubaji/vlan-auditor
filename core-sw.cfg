!
! Sample config: CORE-SW (Cisco Catalyst 2960)
! Demonstrates: native VLAN 1 on a trunk, unpruned trunks,
!               an access port in VLAN 1, and an unused VLAN.
!
version 15.0
hostname CORE-SW
!
vlan 10
 name Users
!
vlan 20
 name Servers
!
vlan 30
 name Voice
!
vlan 99
 name Unused-VLAN
!
vlan 999
 name Native-VLAN
!
interface GigabitEthernet0/1
 description Uplink to ACCESS-SW
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
! NOTE: no 'switchport trunk allowed vlan' list -> carries all VLANs
!
interface GigabitEthernet0/2
 description Server farm
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface GigabitEthernet0/3
 description Spare port
 shutdown
 switchport mode access
 switchport access vlan 1
!
interface GigabitEthernet0/4
 description Uplink to DIST-SW
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,999
!
interface Vlan10
 ip address 192.168.10.1 255.255.255.0
!
interface Vlan20
 ip address 192.168.20.1 255.255.255.0
!
interface Vlan30
 ip address 192.168.30.1 255.255.255.0
!
ip default-gateway 192.168.10.254
!
end
