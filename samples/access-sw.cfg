!
! Sample config: ACCESS-SW (Cisco Catalyst 2960)
! Demonstrates: access ports defaulting to VLAN 1, a port relying on
!               DTP negotiation, a trunk with default native VLAN 1,
!               and an unused VLAN.
!
version 15.0
hostname ACCESS-SW
!
vlan 10
 name Users
!
vlan 20
 name Servers
!
vlan 30
 name Voice
!
vlan 40
 name Old-VLAN
!
interface FastEthernet0/1
 description Workstation A
 switchport mode access
 spanning-tree portfast
! NOTE: no 'switchport access vlan' -> defaults to VLAN 1
!
interface FastEthernet0/2
 description Workstation B
 switchport access vlan 10
! NOTE: missing 'switchport mode access' -> relies on DTP
 spanning-tree portfast
!
interface FastEthernet0/3
 description Printer
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface FastEthernet0/4
 description IP Phone + PC
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 30
 spanning-tree portfast
!
interface GigabitEthernet0/1
 description Uplink to CORE-SW
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
! NOTE: no native VLAN configured -> defaults to VLAN 1
!
end
